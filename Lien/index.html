<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecture aléatoire</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: #222;
      gap: 2rem;
    }

    img {
      cursor: pointer;
      max-width: 240px;
      width: 40vw;
      height: auto;
      transition: transform 0.2s ease-in-out;
    }

    img:hover,
    img:focus {
      transform: scale(1.05);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      text-align: center;
    }

    a {
      color: #0066cc;
      text-decoration: none;
    }

    a:hover,
    a:focus {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <img id="playButton" src="Play.png" alt="Bouton lecture">

  <ul id="linksList"></ul>

  <script>
    // Modifiez simplement les éléments du tableau pour changer les liens.
    const links = [
  { url: "https://www.dropbox.com/scl/fi/0jr8697573ycbpml6s7oi/Vid1.mp4?rlkey=mdbli8rfubghv4sfqk2iekaav&raw=1", label: "" },
  { url: "https://www.youtube.com/watch?v=LPhANpsR1gM", label: "" },
  { url: "https://www.dropbox.com/scl/fi/hcqym0wfnxhb8sbe1qvt8/1.jpeg?rlkey=hwcakwlsen3mddvt02i2sdlve&raw=1", label: "" },
  { url: "https://www.dropbox.com/scl/fi/ml7n4w9utlh12hv8323ea/2.jpeg?rlkey=112nzr8a03qia4tk5qndexef6&raw=1", label: "" },
  { url: "https://www.dropbox.com/scl/fi/oi5eomnztr2bb7kzpfmip/3.jpeg?rlkey=zhv69awjqgna1u1mohmtnxb5h&raw=1", label: "" },
  { url: "https://www.dropbox.com/scl/fi/d7uisy55d2r3xe0sa8km6/4.jpeg?rlkey=zqdrmr533tszvefm9l7p7shw1&raw=1", label: "" },
  { url: "https://www.dropbox.com/scl/fi/prcyriopcjgmjynzcfhu2/5.jpeg?rlkey=4y1i4p8calibq774jina299u7&raw=1", label: "" },
  { url: "https://www.dropbox.com/scl/fi/bzvffk5i5koh01v7nkcov/6.jpeg?rlkey=flllvqy9v7s7ikqln0v2u28u9&raw=1", label: "" },
  { url: "https://www.dropbox.com/scl/fi/2pu3u8kovb8fe27jxt2n1/7.jpeg?rlkey=fjj90tn8a7qxppn860i2m2xfb&raw=1", label: "" },
  { url: "https://www.dropbox.com/scl/fi/rtke8wvknqjezd56nz8pe/27.jpeg?rlkey=loycj1lpg3nz01yaltzgvhu8f&raw=1", label: "" },
  { url: "https://www.dropbox.com/scl/fi/1pr00kvimzg5pc1vmnzf9/26.jpeg?rlkey=9do4yjst5ujqkeeoxz4joog86&raw=1", label: "" },
  { url: "https://www.dropbox.com/scl/fi/go5na3rh3nkh4gp5vfei7/17.jpeg?rlkey=257x2u3dh2529oaej5yp5uaon&raw=1", label: "" },
  { url: "https://www.dropbox.com/scl/fi/u3xpem6p687o39paom50j/13.jpeg?rlkey=9te9195di02mx2b222lcnixl6&raw=1", label: "" },
  { url: "https://www.dropbox.com/scl/fi/u3xpem6p687o39paom50j/13.jpeg?rlkey=9te9195di02mx2b222lcnixl6&raw=1", label: "" }
];

    const linksList = document.getElementById("linksList");
    const playButton = document.getElementById("playButton");

    function renderLinks(list) {
      linksList.innerHTML = list
        .map(({ url, label }) => `<li><a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a></li>`)
        .join("");
    }

    function goToRandomLink(list) {
      if (!list.length) {
        return;
      }
      const randomIndex = Math.floor(Math.random() * list.length);
      window.location.href = list[randomIndex].url;
    }

    renderLinks(links);

    playButton.addEventListener("click", () => goToRandomLink(links));
  </script>
</body>
</html>
